<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.08); opacity: 0.7; }
        100% { transform: scale(1); opacity: 0.4; }
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .node-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .node-float1 { animation: floatNode 5s ease-in-out infinite; transform-origin: center; }
      .node-float2 { animation: floatNode 7s ease-in-out infinite 1s; transform-origin: center; }
      .data-stream { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg)" rx="16"/>

  <!-- Dynamic Network Connections in Background -->
  <g stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 150 80 L 300 180 L 150 280 Z" />
    <path d="M 300 180 L 450 100 L 450 260 Z" />
    <path d="M 1050 70 L 900 170 L 1050 270 Z" />
    <path d="M 900 170 L 750 110 L 750 250 Z" />
    <line x1="300" y1="180" x2="900" y2="170" class="data-stream" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- Dynamic Background Glowing Orbs (Non-obstructive) -->
  <circle cx="150" cy="80" r="45" fill="url(#accent)" class="node-pulse"/>
  <circle cx="1050" cy="270" r="55" fill="url(#accent)" class="node-pulse"/>

  <!-- Animated Nodes -->
  <g fill="#818cf8" filter="url(#glow)">
    <circle cx="300" cy="180" r="8" class="node-float1"/>
    <circle cx="450" cy="100" r="6" class="node-float2"/>
    <circle cx="450" cy="260" r="7" class="node-float1"/>
    <circle cx="900" cy="170" r="8" class="node-float2"/>
    <circle cx="750" cy="110" r="6" class="node-float1"/>
    <circle cx="750" cy="250" r="7" class="node-float2"/>
  </g>

  <!-- Center Card Backdrop for Foreground Contrast -->
  <rect x="220" y="50" width="760" height="250" fill="#0f172a" fill-opacity="0.75" rx="12" stroke="#475569" stroke-width="1"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#titleGrad)" letter-spacing="1">
      Awesome Knowledge Management AI
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">
      AI Enterprise Search • RAG Pipelines • Knowledge Graphs • Intelligent Wikis
    </text>

    <!-- Tagline Pills -->
    <g transform="translate(360, 215)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="65" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ SaaS Leaderboard</text>

      <rect x="150" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="230" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#818cf8">🔥 Star-Sorted Open-Source</text>

      <rect x="330" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="405" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">🛡️ Enterprise Governance</text>
    </g>
  </g>
</svg>
